name: Validate portable skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tracked client distributions without rewriting them
        run: python3 scripts/build_distributions.py --check
      - name: Package Claude.ai skills
        run: python3 scripts/package_claude_ai.py
      - name: Validate catalog and generated drift
        run: python3 scripts/validate.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
